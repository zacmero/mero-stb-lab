<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mero-STB Lab Diagnostic</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #00ff88;
      font-family: monospace, sans-serif;
      text-align: center;
      margin: 0;
      padding: 60px 20px;
    }
    h1 {
      font-size: 48px;
      color: #00ffcc;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 4px;
    }
    .box {
      border: 2px solid #00ff88;
      border-radius: 8px;
      padding: 30px;
      display: inline-block;
      background-color: #111827;
      min-width: 600px;
    }
    p {
      font-size: 24px;
      color: #e5e7eb;
      margin: 10px 0;
    }
    .highlight {
      color: #38bdf8;
      font-weight: bold;
    }
    #clock {
      color: #facc15;
      font-size: 28px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>HELLO FROM THE GH05T</h1>
    <p>Target Device: <span class="highlight">Sagemcom DSI74 V2 HD GVT</span></p>
    <p>SoC Platform: <span class="highlight">STMicroelectronics STiH237</span></p>
    <p>Middleware Engine: <span class="highlight">Ekioh v2.2.4.5</span></p>
    <p>Experiment: <span class="highlight">NET-CONFIG-005 (Local Portal Test)</span></p>
    <div id="clock">Initializing client runtime...</div>
  </div>

  <script>
    function updateClock() {
      var d = new Date();
      var el = document.getElementById('clock');
      if (el) {
        el.innerHTML = "Browser Time: " + d.toTimeString();
      }
    }
    try {
      updateClock();
      setInterval(updateClock, 1000);
    } catch(e) {
      document.getElementById('clock').innerHTML = "Script error: " + e;
    }
  </script>
</body>
</html>
